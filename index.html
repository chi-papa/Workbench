<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workbench</title>
<link rel="icon" type="image/png" href="./apple-boy.png">
<link rel="apple-touch-icon" href="./apple-boy.png">

<style>
@font-face {
  font-family: "Space Grotesk";
  src: url("./SpaceGrotesk-VariableFont_wght.ttf") format("truetype");
  font-weight: 300 700;
  font-style: normal;
  font-display: swap;
}

:root {
  --bg: #ded9ce;
  --surface: #e7e3d9;
  --surface-hover: #ece8df;
  --ink: #23211d;
  --ink-sub: #5f5a50;
  --ink-mute: #857f73;
  --border: rgba(35, 33, 29, 0.11);
  --border-strong: rgba(35, 33, 29, 0.25);
  --pill-active-bg: #23211d;
  --pill-active-ink: #e7e3d9;
  --star: #9e6816;
  --star-bg: rgba(158, 104, 22, 0.12);
  --star-border: rgba(158, 104, 22, 0.42);
  --tag-ok: #3d6347;
  --tag-ok-bg: rgba(61, 99, 71, 0.09);
  --tag-note: #7a6332;
  --tag-note-bg: rgba(122, 99, 50, 0.09);
  --tag-own: #23211d;
  --tag-own-bg: rgba(35, 33, 29, 0.08);
  --shadow-hover: 0 10px 24px -10px rgba(35, 33, 29, 0.12);
  --radius: 12px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #111110;
  --surface: #181816;
  --surface-hover: #1e1e1b;
  --ink: #ebe8e1;
  --ink-sub: #959086;
  --ink-mute: #5c5850;
  --border: rgba(235, 232, 225, 0.08);
  --border-strong: rgba(235, 232, 225, 0.2);
  --pill-active-bg: #ebe8e1;
  --pill-active-ink: #111110;
  --star: #e2b462;
  --star-bg: rgba(226, 180, 98, 0.12);
  --star-border: rgba(226, 180, 98, 0.35);
  --tag-ok: #84b892;
  --tag-ok-bg: rgba(132, 184, 146, 0.12);
  --tag-note: #d4b475;
  --tag-note-bg: rgba(212, 180, 117, 0.12);
  --tag-own: #d8d4cb;
  --tag-own-bg: rgba(235, 232, 225, 0.12);
  --shadow-hover: 0 16px 32px -12px rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  padding:
    calc(clamp(32px, 5.5vw, 64px) + env(safe-area-inset-top, 0px))
    clamp(20px, 5.5vw, 60px)
    calc(clamp(48px, 6vw, 72px) + env(safe-area-inset-bottom, 0px));
  transition: background-color 0.25s var(--ease), color 0.25s var(--ease);
}

.wrap {
  max-width: 1200px;
  margin: 0 auto;
}

/* Header */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: clamp(32px, 4.5vw, 48px);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.brand h1 {
  margin: 0;
  font-family: "Space Grotesk", sans-serif;
  font-size: clamp(20px, 2.4vw, 26px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
}

.brand .meta {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
  color: var(--ink-mute);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.theme-btn {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink-sub);
  cursor: pointer;
  transition: border-color 0.2s var(--ease), color 0.2s var(--ease), background-color 0.2s var(--ease);
}

.theme-btn:hover {
  border-color: var(--border-strong);
  color: var(--ink);
  background: var(--surface-hover);
}

/* Primary Navigation */
#top {
  display: flex;
  align-items: center;
  gap: clamp(22px, 3.2vw, 40px);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
#top::-webkit-scrollbar { display: none; }

#top button {
  position: relative;
  flex: none;
  display: inline-flex;
  align-items: baseline;
  gap: 7px;
  padding: 0 0 15px;
  border: 0;
  background: none;
  color: var(--ink-sub);
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: color 0.2s var(--ease);
}

#top button:hover {
  color: var(--ink);
}

#top button[aria-selected="true"] {
  color: var(--ink);
  font-weight: 600;
}

#top button[aria-selected="true"]::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 1.5px;
  background: var(--ink);
}

#top button .num {
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: 11px;
  font-weight: 400;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}

#top button[aria-selected="true"] .num {
  color: var(--ink-sub);
}

/* Sub Navigation & Status Bar */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 14px 24px;
  margin: 24px 0 30px;
  min-height: 30px;
}

#sub {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

#sub button {
  font: inherit;
  font-size: 12px;
  font-weight: 500;
  padding: 5px 13px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--ink-sub);
  cursor: pointer;
  transition: all 0.2s var(--ease);
}

#sub button:hover {
  border-color: var(--border-strong);
  color: var(--ink);
}

#sub button[aria-selected="true"] {
  background: var(--pill-active-bg);
  border-color: var(--pill-active-bg);
  color: var(--pill-active-ink);
}

#cnt {
  margin-left: auto;
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: 11.5px;
  color: var(--ink-mute);
  letter-spacing: 0.03em;
  font-variant-numeric: tabular-nums;
}

/* Grid */
main {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
  gap: clamp(14px, 2vw, 20px);
}

/* Card */
.c {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition:
    transform 0.28s var(--ease),
    border-color 0.25s var(--ease),
    background-color 0.25s var(--ease),
    box-shadow 0.28s var(--ease);
}

.c:hover {
  transform: translateY(-2px);
  border-color: var(--border-strong);
  background: var(--surface-hover);
  box-shadow: var(--shadow-hover);
}

.c.f {
  border-color: var(--star-border);
}

.c a {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 24px;
  height: 100%;
  padding: 20px 22px 22px;
  color: inherit;
  text-decoration: none;
  border-radius: var(--radius);
}

.c-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-right: 32px;
}

.c-idx {
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: 11px;
  color: var(--ink-mute);
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
}

.c-tag {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.02em;
  padding: 2px 7px;
  border-radius: 4px;
  line-height: 1.3;
}

.c-tag.ok {
  color: var(--tag-ok);
  background: var(--tag-ok-bg);
}

.c-tag.note {
  color: var(--tag-note);
  background: var(--tag-note-bg);
}

.c-tag.own {
  color: var(--tag-own);
  background: var(--tag-own-bg);
}

.c-body {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.c-title-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
}

.c b {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.015em;
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.c-arrow {
  flex: none;
  font-size: 13px;
  color: var(--ink-mute);
  opacity: 0;
  transform: translate(-3px, 3px);
  transition: opacity 0.22s var(--ease), transform 0.25s var(--ease), color 0.2s var(--ease);
}

.c:hover .c-arrow {
  opacity: 1;
  color: var(--ink);
  transform: translate(0, 0);
}

.c span.sub {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11.5px;
  color: var(--ink-sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Favorite Button */
.c .fav-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--ink-mute);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  transition: color 0.2s var(--ease), background-color 0.2s var(--ease), transform 0.2s var(--ease);
}

.c .fav-btn:hover {
  background: var(--star-bg);
  color: var(--star);
}

.c .fav-btn:active {
  transform: scale(0.9);
}

.c.f .fav-btn {
  color: var(--star);
}

/* Empty State */
.e {
  grid-column: 1 / -1;
  padding: 72px 20px;
  text-align: center;
  color: var(--ink-sub);
  font-size: 13.5px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
}

/* Footer */
footer {
  margin-top: clamp(48px, 6vw, 72px);
  padding-top: 20px;
  border-top: 1px solid var(--border);
  font-size: 11.5px;
  color: var(--ink-mute);
  line-height: 1.7;
}

/* Focus */
button:focus-visible, a:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Mobile Adjustments */
@media (max-width: 600px) {
  main {
    grid-template-columns: 1fr;
  }
  .c-arrow {
    opacity: 0.5;
    transform: none;
  }
}
</style>
</head>

    document.documentElement.setAttribute("data-theme", "dark");
  }
} catch(e) {}
updateThemeIcon();

themeBtn.onclick = function() {
  var next = isDark() ? "ivory" : "dark";
  if (next === "dark") document.documentElement.setAttribute("data-theme", "dark");
  else document.documentElement.removeAttribute("data-theme");
  try { localStorage.setItem("theme", next); } catch(e) {}
  updateThemeIcon();
};

/* Render */
function mkSub(box, label, sel, fn) {
  var b = document.createElement("button");
  b.type = "button";
  b.textContent = label;
  b.setAttribute("aria-selected", sel);
  b.onclick = fn;
  box.appendChild(b);
}

function draw() {
  var top = document.getElementById("top");
  top.textContent = "";
  [1, 0, 2, 3].forEach(function(i) {
    var k = D.filter(function(r) { return r[0] === i; }).length;
    var b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", i === g);
    b.innerHTML = G[i] + '<span class="num">' + String(k).padStart(2, "0") + '</span>';
    b.onclick = function() { g = i; s = 1; draw(); };
    top.appendChild(b);
  });

  var sub = document.getElementById("sub");
  sub.textContent = "";
  sub.style.display = g === 0 ? "flex" : "none";
  if (g === 0) {
    SC.forEach(function(c, i) {
      var label = i === 0
        ? "★ " + D.filter(function(r) { return r[0] === 0 && fav[r[3]]; }).length
        : c;
      mkSub(sub, label, i === s, function() { s = i; draw(); });
    });
  }

  var rows = D.filter(function(r) {
    if (r[0] !== g) return false;
    if (g !== 0) return true;
    return s === 0 ? fav[r[3]] : r[1] === SC[s];
  });

  rows.sort(function(a, b) { return (fav[b[3]] ? 1 : 0) - (fav[a[3]] ? 1 : 0); });

  var metaText = String(rows.length).padStart(2, "0") + " ITEMS";
  if (g === 0) metaText += " — " + SC[s];
  document.getElementById("cnt").textContent = metaText;

  var m = document.getElementById("list");
  m.textContent = "";
  if (!rows.length) {
    var e = document.createElement("div");
    e.className = "e";
    e.textContent = "★ をクリックすると、ここと各カテゴリの先頭に固定表示されます";
    m.appendChild(e);
    return;
  }

  rows.forEach(function(r, idx) {
    var isFav = !!fav[r[3]];
    var d = document.createElement("article");
    d.className = "c" + (isFav ? " f" : "");

    var a = document.createElement("a");
    a.href = r[3];
    a.target = "_blank";
    a.rel = "noopener noreferrer";

    var head = document.createElement("div");
    head.className = "c-head";
    var num = document.createElement("span");
    num.className = "c-idx";
    num.textContent = String(idx + 1).padStart(2, "0");
    head.appendChild(num);

    if (r[5]) {
      var tag = document.createElement("span");
      var cls = r[5] === "商用可" ? "ok" : (r[5] === "自作" ? "own" : "note");
      tag.className = "c-tag " + cls;
      tag.textContent = r[5];
      head.appendChild(tag);
    }

    var body = document.createElement("div");
    body.className = "c-body";

    var trow = document.createElement("div");
    trow.className = "c-title-row";
    var b = document.createElement("b");
    b.textContent = r[2];
    var arrow = document.createElement("span");
    arrow.className = "c-arrow";
    arrow.textContent = "↗";
    trow.appendChild(b);
    trow.appendChild(arrow);

    var t = document.createElement("span");
    t.className = "sub";
    t.textContent = r[4] || host(r[3]);

    body.appendChild(trow);
    body.appendChild(t);
    a.appendChild(head);
    a.appendChild(body);

    var f = document.createElement("button");
    f.type = "button";
    f.className = "fav-btn";
    f.textContent = isFav ? "★" : "☆";
    f.setAttribute("aria-label", r[2] + "をお気に入りに" + (isFav ? "から外す" : "追加"));
    f.onclick = function() {
      if (fav[r[3]]) delete fav[r[3]];
      else fav[r[3]] = 1;
      save();
      draw();
    };

    d.appendChild(a);
    d.appendChild(f);
    m.appendChild(d);
  });
}

draw();
</script>
</body>
</html>
